name: 更新直播來源清單

# 直播影片 ID 每換一場就會變，寫死在頁面裡的清單會逐漸失效。
# 這個排程定期重新解析各頻道目前的直播，把結果寫進 streams.json。
#
# 排程目前停用中。原因：從 GitHub Actions 的資料中心 IP 請求 YouTube 的 /live
# 頁面時，回來的頁面結構與一般網路不同，canonical 會指向推薦區塊裡不相干的影片
# —— 實測 9 路有 8 路解析錯誤，NBC News 與 TRT World 甚至同時被解析成 Jon
# Stewart 的節目。腳本現已加上歸屬驗證會擋掉這類結果，但擋掉之後 CI 上就等於
# 永遠解析不出新 ID，排程沒有意義。
#
# 目前的用法是在一般網路環境手動執行 `node scripts/refresh-streams.mjs`。
# 若要恢復全自動，需改接 YouTube Data API（需要 API 金鑰）。
#
on:
  # schedule:
  #   - cron: '0 */6 * * *'
  workflow_dispatch:         # 只保留手動觸發

# 同時只跑一個，避免兩次排程互相踩到
concurrency:
  group: refresh-streams
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析各頻道目前的直播 ID
        run: node scripts/refresh-streams.mjs

      - name: 有變動才 commit
        run: |
          if git diff --quiet -- streams.json; then
            echo "streams.json 沒有變動，不建立 commit。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streams.json
          git commit -m "chore: 更新直播來源清單"
          git push
